<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的健康記錄</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #fff0f5;      
            --primary: #ff8da1;       
            --primary-dark: #ff6b8b;  
            --secondary: #ffb6c1;     
            --text-dark: #5c4044;     
            --text-light: #9fa6b2;    
            --white: #ffffff;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); margin: 0;
            color: var(--text-dark); padding-bottom: 70px; display: flex; justify-content: center;
        }
        .app-container { width: 100%; max-width: 450px; min-height: 100vh; background: transparent; }
        .page { display: none; padding: 1.5rem; animation: fadeIn 0.3s ease-in-out; box-sizing: border-box; }
        .page.active { display: block; }
        #loginPage.active { display: flex; flex-direction: column; justify-content: center; min-height: 85vh; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--white); padding: 1.5rem; border-radius: 24px; box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2); text-align: center; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-dark); }
        .date-subtitle { color: var(--text-light); margin-bottom: 1rem; font-size: 0.9rem; }
        
        .progress-circle {
            width: 160px; height: 160px; background: #fff5f7; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 1.5rem; border: 8px solid var(--secondary); box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }
        .current-ml { font-size: 2.2rem; font-weight: bold; color: var(--primary-dark); }
        .label { font-size: 0.85rem; color: var(--text-light); }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
        .btn {
            border: none; padding: 12px 8px; border-radius: 16px; font-size: 0.95rem; cursor: pointer;
            transition: 0.2s; font-weight: bold; flex: 1 1 45%; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn:active { transform: scale(0.95); }
        .btn-add { background-color: var(--primary); color: white; }
        .btn-add-special { background-color: var(--secondary); color: var(--text-dark); }
        .btn-custom { background-color: var(--white); color: var(--primary-dark); border: 2px solid var(--primary); flex: 1 1 100%; }
        .btn-undo { background-color: #e0e0e0; color: #555; }
        .btn-clear { background-color: #ff9e9e; color: white; }
        .history-section { text-align: left; }
        .history-section h3 { font-size: 1rem; border-bottom: 2px solid var(--bg-color); padding-bottom: 8px; color: var(--text-dark); margin-top: 1.5rem;}
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bg-color); font-size: 0.95rem; }
        .log-time { color: var(--text-light); font-weight: bold; }
        .log-name { font-size: 0.8em; color: var(--primary); margin-left: 5px; background: var(--bg-color); padding: 2px 6px; border-radius: 8px; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-bottom: 1.5rem; }
        .date-picker-wrapper { text-align: center; margin-bottom: 1rem; }
        input[type="date"], input[type="number"], input[type="email"], input[type="password"], textarea { 
            padding: 12px; border-radius: 12px; border: 2px solid var(--secondary); font-family: inherit; color: var(--text-dark); background: var(--bg-color); outline: none; box-sizing: border-box; 
        }
        .weight-input-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; }
        .weight-input-container input { font-size: 2rem; width: 120px; text-align: center; font-weight: bold; color: var(--primary-dark); border: 2px solid var(--secondary); }
        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); justify-content: space-around;
            padding: 10px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.05); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-light); font-size: 0.7rem; cursor: pointer; padding: 5px 2px; flex: 1; }
        .nav-item.active { color: var(--primary-dark); font-weight: bold; }
        .nav-icon { font-size: 1.4rem; margin-bottom: 3px; }
        .login-input { width: 100%; margin-bottom: 15px; font-size: 1rem; }
        
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
            animation: fadeIn 0.2s ease-in-out;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: var(--white); width: 85%; max-width: 350px; padding: 1.5rem;
            border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* 🌟 新增：連續達標火焰特效 */
        .streak-badge {
            display: none;
            background: linear-gradient(45deg, #ff6b8b, #ffb6c1);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(255, 107, 139, 0.3);
            animation: bounce 1.5s infinite alternate;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }

        /* 🌟 新增：飲食仙女與罪惡標籤特效 */
        .tag-btn { border: 2px solid #e0e0e0; background: var(--white); color: var(--text-light); transition: 0.2s; }
        .tag-btn.active-angel { border-color: #27ae60; background: #e8f8f5; color: #27ae60; }
        .tag-btn.active-devil { border-color: #c0392b; background: #fdedec; color: #c0392b; }

    </style>
</head>
<body>

<div class="app-container">

    <div id="userStatusBar" style="display:none; text-align: center; font-size: 0.8rem; color: var(--text-light); margin: 15px 0 5px 0;">
        ✅ 已登入：<span id="currentUserEmail" style="font-weight: bold; color: var(--primary-dark);"></span>
    </div>

    <div id="loginPage" class="page active">
        <div class="card" style="padding: 2rem 1.5rem;">
            <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">🔒 專屬記錄</h1>
            <p class="date-subtitle" style="margin-bottom: 1.5rem;">請輸入您的專屬帳號密碼</p>
            <input type="email" id="emailInput" class="login-input" placeholder="請輸入信箱">
            <input type="password" id="pwdInput" class="login-input" placeholder="請輸入密碼">
            <button id="loginBtn" class="btn btn-add" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 10px;" onclick="signIn()">立即登入</button>
        </div>
    </div>

    <div id="homePage" class="page">
        <div class="card">
            <h1>沒事多喝水</h1>
            <div class="date-subtitle" id="homeDateDisplay">載入中...</div>
            
            <div id="streakBadge" class="streak-badge">🔥 連續達標：<span id="streakCount">0</span> 天</div>

            <div id="homeProgress" style="width: 220px; height: 220px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 1.5rem; position: relative; background: conic-gradient(var(--primary) 0%, #fff5f7 0%); box-shadow: 0 4px 15px rgba(255, 141, 161, 0.2);">
                <div style="position: absolute; inset: 12px; background: var(--white); border-radius: 50%;"></div>
                <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding-top: 10px;">
                    <span class="current-ml" id="homeTotalAmount" style="font-size: 3rem;">0</span>
                    <span class="label" style="font-size: 0.95rem; color: var(--text-light); margin-top: -5px;">/ 2000 ml</span>
                </div>
            </div>
            
            <p style="color: var(--text-light); font-size: 0.9rem;">每天達標 2000ml，讓身體更健康！</p>
            <button class="btn btn-add" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 10px;" onclick="switchTab('record')">💧 點我喝水</button>
            
            <div style="display: flex; justify-content: space-around; margin-top: 25px; padding-top: 15px; border-top: 1px dashed var(--bg-color);">
                <button onclick="exportToCSV(event)" style="background:none; border:none; color: #27ae60; cursor:pointer; font-size:0.85rem; text-decoration:underline; font-weight:bold;">📥 匯出 Excel</button>
                <button onclick="logOut()" style="background:none; border:none; color:var(--text-light); cursor:pointer; font-size:0.85rem; text-decoration:underline;">登出帳號</button>
            </div>
        </div>
    </div>

    <div id="recordPage" class="page">
        <div class="card">
            <h1>💧 新增記錄</h1>
            <div class="progress-circle"><span class="current-ml" id="recordTotalAmount">0</span><span class="label">ml</span></div>
            <div class="btn-group">
                <button class="btn btn-add-special" onclick="addWater(473, 'Fellow')">Fellow 473 ml</button>
                <button class="btn btn-add-special" onclick="addWater(700, '大象杯')">大象杯 700 ml</button>
            </div>
            <div class="btn-group" id="customBtnGroup"></div>
            <div class="btn-group">
                <button class="btn btn-custom" style="flex: 1 1 45%;" onclick="customInput()">✏️ 手動輸入</button>
                <button class="btn btn-custom" style="flex: 1 1 45%; color: var(--primary-dark); border-color: var(--secondary);" onclick="addCustomButton()">➕ 新增按鈕</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-undo" onclick="undoLast()">↩️ 上一步</button>
                <button class="btn btn-clear" onclick="clearToday()">🗑️ 清除今日</button>
            </div>
            <button class="btn btn-custom" style="width: 100%; margin-top: 5px; border-style: dashed; color: #f39c12; border-color: #f39c12;" onclick="openRetroModal('water')">📅 記錄補登</button>
        </div>
        <div class="card history-section">
            <h3 style="margin-top:0;">今日記錄</h3>
            <div id="logList"><div style="text-align:center; color:#ccc; padding:10px;">讀取資料中...</div></div>
        </div>
    </div>

    <div id="weightPage" class="page">
        <div class="card">
            <h1>⚖️ 體重記錄</h1>
            <p class="date-subtitle">記錄今天的體重變化</p>
            <div class="weight-input-container">
                <input type="number" id="weightInput" step="0.1" placeholder="00.0">
                <span style="font-size: 1.5rem; color: var(--text-light); font-weight: bold;">kg</span>
            </div>
            <button class="btn btn-add" style="width: 100%; padding: 15px; font-size: 1.1rem;" onclick="saveWeight()">儲存體重</button>
            <button class="btn btn-custom" style="width: 100%; padding: 12px; margin-top: 15px; border-style: dashed; color: #9b59b6; border-color: #9b59b6;" onclick="openRetroModal('weight')">📅 記錄補登</button>
        </div>
        <div class="card">
            <h3>📈 體重趨勢</h3>
            <div class="chart-container"><canvas id="weightChart"></canvas></div>
        </div>
        <div class="card history-section">
            <h3 style="margin-top:0;">近期記錄</h3>
            <div id="weightLogList"><div style="text-align:center; color:#ccc; padding:10px;">讀取資料中...</div></div>
        </div>
    </div>

    <div id="dietPage" class="page">
        <div class="card">
            <h1>🍱 飲食記錄</h1>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="btnTagAngel" class="btn tag-btn" style="flex:1;" onclick="toggleDietTag('😇')">😇 仙女餐</button>
                <button id="btnTagDevil" class="btn tag-btn" style="flex:1;" onclick="toggleDietTag('😈')">😈 罪惡餐</button>
            </div>

            <div style="text-align: left; margin-bottom: 8px; color: var(--text-dark); font-weight: bold; font-size: 0.95rem;">💧 飲</div>
            <div class="btn-group" style="margin-bottom: 15px;">
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('☕ 咖啡')">咖啡</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍵 無糖茶')">無糖茶</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🧋 手搖飲')">手搖飲</button>
            </div>

            <div style="text-align: left; margin-bottom: 8px; color: var(--text-dark); font-weight: bold; font-size: 0.95rem;">🍽️ 食</div>
            <div class="btn-group" style="margin-bottom: 20px;">
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('👩‍🍳 媽媽食物')">媽媽食物</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍝 義大利麵')">義大利麵</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍛 燉飯')">燉飯</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍜 拉麵')">拉麵</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍣 壽司')">壽司</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍲 火鍋')">火鍋</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍞 麵包')">麵包</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🥚 蛋')">蛋</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍢 夜市')">夜市</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍬 糖果')">糖果</button>
                <button class="btn btn-add-special" style="flex: 1 1 30%; font-size: 0.85rem;" onclick="appendDiet('🍪 餅乾')">餅乾</button>
            </div>

            <textarea id="dietInput" placeholder="點擊上方按鈕，或在此手動輸入..." rows="3" style="width: 100%; margin-bottom: 15px; resize: none; font-size:1rem;"></textarea>
            <button class="btn btn-add" style="width: 100%; padding: 15px; font-size: 1.1rem;" onclick="saveDiet()">儲存飲食</button>
            <button class="btn btn-custom" style="width: 100%; padding: 12px; margin-top: 15px; border-style: dashed; color: #27ae60; border-color: #27ae60;" onclick="openRetroModal('diet')">📅 記錄補登</button>
        </div>
        <div class="card history-section">
            <h3 style="margin-top:0;">近期記錄</h3>
            <div id="dietLogList"><div style="text-align:center; color:#ccc; padding:10px;">讀取資料中...</div></div>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <div class="card">
            <h1>📅 喝水統計</h1>
            <p class="date-subtitle">本月每日喝水量</p>
            <div class="chart-container"><canvas id="waterChart"></canvas></div>
        </div>
        <div class="card history-section">
            <div class="date-picker-wrapper">
                <label for="historyDate" style="font-weight:bold; color:var(--text-dark);">查詢指定日期：</label><br><br>
                <input type="date" id="historyDate" onchange="fetchHistoryByDate()">
            </div>
            
            <div style="border-top: 2px dashed var(--bg-color); margin-top: 20px; padding-top: 10px;">
                <h3 style="color: var(--primary);"><span style="font-size:1.2rem;">💧</span> 喝水總覽</h3>
                <div style="text-align:center; font-size:1.5rem; font-weight:bold; color:var(--primary); margin: 5px 0;" id="historyTotal">0 ml</div>
                <div id="historyLogList" style="margin-bottom: 20px;"><div style="text-align:center; color:var(--text-light); padding:10px;">無喝水記錄</div></div>
                
                <h3 style="color: #9b59b6;"><span style="font-size:1.2rem;">⚖️</span> 體重記錄</h3>
                <div id="historyWeightList" style="margin-bottom: 20px;"><div style="text-align:center; color:var(--text-light); padding:10px;">無體重記錄</div></div>

                <h3 style="color: #f39c12;"><span style="font-size:1.2rem;">🍱</span> 飲食記錄</h3>
                <div id="historyDietList"><div style="text-align:center; color:var(--text-light); padding:10px;">無飲食記錄</div></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="switchTab('home')" id="tab-home"><span class="nav-icon">🏠</span><span>首頁</span></button>
        <button class="nav-item" onclick="switchTab('record')" id="tab-record"><span class="nav-icon">💧</span><span>喝水</span></button>
        <button class="nav-item" onclick="switchTab('weight')" id="tab-weight"><span class="nav-icon">⚖️</span><span>體重</span></button>
        <button class="nav-item" onclick="switchTab('diet')" id="tab-diet"><span class="nav-icon">🍱</span><span>飲食</span></button>
        <button class="nav-item" onclick="switchTab('calendar')" id="tab-calendar"><span class="nav-icon">📅</span><span>月曆</span></button>
    </div>

    <div id="retroModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="retroModalTitle" style="margin-top: 0; color: var(--text-dark); font-size: 1.3rem;">📅 補登記錄</h2>
            <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 15px;">請選擇日期與輸入內容</p>
            
            <input type="date" id="retroDate" style="width: 100%; margin-bottom: 15px;">
            
            <input type="number" id="retroWater" placeholder="輸入喝水量 (ml)" style="width: 100%; margin-bottom: 15px; display: none;">
            <input type="number" id="retroWeight" step="0.1" placeholder="輸入體重 (kg)" style="width: 100%; margin-bottom: 15px; display: none;">
            
            <select id="retroDietTag" style="width: 100%; margin-bottom: 10px; display: none; padding: 12px; border-radius: 12px; border: 2px solid var(--secondary); background: var(--bg-color); outline: none;">
                <option value="">(不加標籤)</option>
                <option value="😇">😇 仙女餐</option>
                <option value="😈">😈 罪惡餐</option>
            </select>
            <textarea id="retroDiet" placeholder="輸入補登的飲食內容..." rows="3" style="width: 100%; margin-bottom: 15px; resize: none; display: none;"></textarea>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-undo" style="flex: 1;" onclick="closeRetroModal()">取消</button>
                <button id="retroSaveBtn" class="btn btn-add" style="flex: 1;" onclick="saveRetroRecord()">確認補登</button>
            </div>
        </div>
    </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, query, where, onSnapshot, getDocs, Timestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDB3WJa1pmBcjxk0EKQM6is4z2n5oCY0W4",
    authDomain: "watertracker-1974e.firebaseapp.com",
    projectId: "watertracker-1974e",
    storageBucket: "watertracker-1974e.firebasestorage.app",
    messagingSenderId: "123716041712",
    appId: "1:123716041712:web:a94050f8faf9bdac9b7b35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.currentDocs = [];
  let waterChartInstance = null; 
  let weightChartInstance = null; 
  let waterListenerUnsubscribe = null; 
  let hasAchievedGoalToday = false;
  
  // 飲食標籤變數
  window.currentDietTag = '';

  function getTodayString() {
      const d = new Date();
      const offset = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - offset).toISOString().split('T')[0];
  }
  
  // 取得任意日期物件的字串格式 (用來算連續天數)
  function getDateStringFromDate(dObj) {
      const offset = dObj.getTimezoneOffset() * 60000;
      return new Date(dObj.getTime() - offset).toISOString().split('T')[0];
  }

  const todayStr = getTodayString();
  document.getElementById('homeDateDisplay').innerText = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('historyDate').value = todayStr; 
  document.getElementById('historyDate').max = todayStr;   

  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById('userStatusBar').style.display = 'block';
          document.getElementById('currentUserEmail').innerText = user.email;
          document.getElementById('loginPage').classList.remove('active'); 
          document.getElementById('bottomNav').style.display = 'flex'; 
          switchTab('home'); 
          startWaterListener(); 
      } else {
          document.getElementById('userStatusBar').style.display = 'none';
          document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
          document.getElementById('loginPage').classList.add('active');

  // 🌟 新增：計算連續達標火焰 (Streak)
  async function updateStreak() {
      const snap = await getDocs(collection(db, "water_logs"));
      const dailyTotals = {};
      snap.forEach(doc => {
          const data = doc.data();
          if(!dailyTotals[data.date]) dailyTotals[data.date] = 0;
          dailyTotals[data.date] += data.amount;
      });
      
      let streak = 0;
      let curr = new Date();
      
      // 檢查今天
      if (dailyTotals[todayStr] && dailyTotals[todayStr] >= 2000) {
          streak++;
          curr.setDate(curr.getDate() - 1);
      } else {
          // 如果今天還沒達標，從昨天開始檢查，避免斷掉
          curr.setDate(curr.getDate() - 1);
      }

      // 往回推算每一天
      while(true) {
          let dStr = getDateStringFromDate(curr);
          if (dailyTotals[dStr] && dailyTotals[dStr] >= 2000) {
              streak++;
              curr.setDate(curr.getDate() - 1);
          } else {
              break; // 一斷掉就停止
          }
      }

      const badge = document.getElementById('streakBadge');
      if(streak > 0) {
          badge.style.display = 'inline-block';
          document.getElementById('streakCount').innerText = streak;
      } else {
          badge.style.display = 'none';
      }
  }

      if (waterListenerUnsubscribe) { waterListenerUnsubscribe(); } 
      const qToday = query(collection(db, "water_logs"), where("date", "==", todayStr));

          let total = 0; let html = ''; const docs = [];
          snapshot.forEach((docSnap) => { docs.push({ id: docSnap.id, ...docSnap.data() }); });
          docs.sort((a, b) => b.timestamp - a.timestamp); window.currentDocs = docs;
          
          docs.forEach((data) => {
              total += data.amount;
              let timeStr = '--:--';
              if (data.timestamp) {
                  const dateObj = data.timestamp.toDate();
                  timeStr = dateObj.getHours().toString().padStart(2, '0') + ':' + dateObj.getMinutes().toString().padStart(2, '0');
              }
              let itemName = data.itemName ? `<span class="log-name">${data.itemName}</span>` : '';
              html += `<div class="log-item"><div><span class="log-time">${timeStr}</span> ${itemName}</div><span style="color: var(--primary-dark); font-weight:bold;">${data.amount} ml</span></div>`;
          });
          
          document.getElementById('homeTotalAmount').innerText = total;
          document.getElementById('recordTotalAmount').innerText = total;
          document.getElementById('logList').innerHTML = html || '<div style="text-align:center; color:var(--text-light); padding:10px;">今天還沒喝水喔，趕快喝一杯吧！</div>';

          let percentage = (total / 2000) * 100;
          if (percentage > 100) percentage = 100;
          document.getElementById('homeProgress').style.background = `conic-gradient(var(--primary) ${percentage}%, #fff5f7 0%)`;

          if (total >= 2000 && !hasAchievedGoalToday) {

  async function loadMonthlyChart() {
      const date = new Date(); const year = date.getFullYear(); let month = date.getMonth() + 1; month = month < 10 ? '0' + month : month;

      const querySnapshot = await getDocs(qMonth).catch(e => { return {forEach:()=>{}}; });
      const dailyTotals = {};
      querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if (!dailyTotals[data.date]) dailyTotals[data.date] = 0;
          dailyTotals[data.date] += data.amount;
      });
      const sortedDates = Object.keys(dailyTotals).sort();
      const labels = sortedDates.map(d => { const parts = d.split('-'); return `${parts[1]}/${parts[2]}`; });
      const dataPoints = sortedDates.map(d => dailyTotals[d]);
      if (waterChartInstance) { waterChartInstance.destroy(); }
      const ctx = document.getElementById('waterChart').getContext('2d');
      waterChartInstance = new Chart(ctx, {
          type: 'bar', data: { labels: labels.length > 0 ? labels : ['尚未有記錄'], datasets: [{ label: '每日喝水量 (ml)', data: dataPoints.length > 0 ? dataPoints : [0], backgroundColor: '#ffb6c1', borderColor: '#ff8da1', borderWidth: 1, borderRadius: 6 }] },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
      });
  }

          else if (window.retroType === 'weight') {
              const val = parseFloat(document.getElementById('retroWeight').value);
              if(isNaN(val) || val <= 0) throw new Error("請輸入有效體重");
              await addDoc(collection(db, "weight_logs"), { weight: val, date: rDate, timestamp: retroTimestamp });
              window.loadWeightData();
          } 
          else if (window.retroType === 'diet') {
              const val = document.getElementById('retroDiet').value.trim();
              const tagVal = document.getElementById('retroDietTag').value; // 抓取補登的標籤
              if(!val) throw new Error("請輸入飲食內容");
              await addDoc(collection(db, "diet_logs"), { meal: val, tag: tagVal, date: rDate, timestamp: retroTimestamp });
              window.loadDietData();
          }
          alert("✅ 補登成功！請至「月曆」分頁查詢。");
          window.closeRetroModal();
      } catch (e) { alert(e.message || "儲存失敗，請重試"); }
      btn.innerText = "確認補登";
  };

  window.exportToCSV = async (event) => {
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "📥 資料整理中...";
      
      try {
          let allData = [];
          const waterSnap = await getDocs(collection(db, "water_logs"));
          waterSnap.forEach(d => { let obj=d.data(); obj.type="💧 喝水"; obj.ts = obj.timestamp?obj.timestamp.toDate().getTime():0; allData.push(obj); });
          
          const weightSnap = await getDocs(collection(db, "weight_logs"));
          weightSnap.forEach(d => { let obj=d.data(); obj.type="⚖️ 體重"; obj.ts = obj.timestamp?obj.timestamp.toDate().getTime():0; allData.push(obj); });
          
          const dietSnap = await getDocs(collection(db, "diet_logs"));
          dietSnap.forEach(d => { let obj=d.data(); obj.type="🍱 飲食"; obj.ts = obj.timestamp?obj.timestamp.toDate().getTime():0; allData.push(obj); });
          
          allData.sort((a,b) => b.ts - a.ts); 
          
          let csvContent = "\uFEFF分類,日期,時間,數值,備註\n";
          allData.forEach(data => {
              let dObj = data.timestamp ? data.timestamp.toDate() : new Date(data.date);
              let timeStr = dObj.getHours().toString().padStart(2, '0') + ':' + dObj.getMinutes().toString().padStart(2, '0');
              let val = data.amount ? `${data.amount} ml` : (data.weight ? `${data.weight} kg` : "");
              
              // 把 tag 組合進備註裡
              let tagStr = data.tag ? `[${data.tag}] ` : "";
              let note = data.itemName || data.meal || "";
              note = `"${tagStr}${note.replace(/"/g, '""').replace(/\n/g, ' ')}"`; 
              
              csvContent += `${data.type},${data.date},${timeStr},${val},${note}\n`;
          });
          
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement("a");
          const url = URL.createObjectURL(blob);
          link.setAttribute("href", url);
          link.setAttribute("download", `健康記錄_${getTodayString()}.csv`);
          link.style.visibility = 'hidden';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          btn.innerText = originalText;
      } catch (error) {
          console.error(error);
          alert("匯出失敗，請確認網路連線。");
          btn.innerText = originalText;
      }
  };

</script>
</body>
